name: Gold and Nikkei 225 Monitor

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 先に主要ライブラリをインストール
          pip install pandas==2.0.3 yfinance requests pytz
          # pandas_ta を依存関係を無視せずにインストール（バージョン指定なしで安定版を狙う）
          pip install pandas-ta

      - name: Run analysis
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py
