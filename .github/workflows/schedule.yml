name: Gold and Nikkei 225 Monitor

on:
  push:
    branches: [ main ]
  schedule:
    # 1時間おきに実行 (UTC 0分)
    - cron: '0 * * * *'
  workflow_dispatch: # 手動実行ボタン

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 主要ライブラリを先にインストール
          pip install pandas yfinance requests pytz
          # pandas-ta を GitHub の 'main' ブランチから直接インストール
          pip install https://github.com/twopirllc/pandas-ta/archive/refs/heads/main.zip

      - name: Run analysis
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py
