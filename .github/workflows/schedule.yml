name: Gold and Nikkei 225 Monitor

on:
  push:
    branches: [ main ]
  schedule:
    # 1時間おきに実行する設定（JST 9:00 - 24:00の間など調整可能）
    # 分 時 日 月 曜日 (UTC基準なので注意)
    - cron: '0 * * * *'
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests pytz pandas_ta

      - name: Run analysis
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py
