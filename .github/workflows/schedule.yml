name: Gold and Nikkei 225 Monitor

on:
  push:
    branches: [ main ]
  # 自動実行（1時間に1回）
  schedule:
    - cron: '0 * * * *'
  # 手動実行ボタンを表示
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests pytz pandas_ta

      - name: Run analysis
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py
